name: swat-plus
services:
  db:
    image: 'postgres:18-alpine'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - postgres_password
    volumes:
      -
    networks:
      -
    ports:
      - "3000:3000"
    healthcheck:
      test: [""]